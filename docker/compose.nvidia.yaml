# With an NVIDIA GPU (Linux with the NVIDIA Container Toolkit, or Windows with Docker Desktop and WSL2):
#   docker compose -f compose.yaml -f compose.nvidia.yaml up -d
services:
  herde:
    image: ghcr.io/schaefchens/herde:cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
