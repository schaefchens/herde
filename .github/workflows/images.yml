name: images

# herde's images on ghcr.io/schaefchens/herde, for anyone who runs a worker:
# - a version tag (v0.2.0): :0.2.0-base and :0.2.0-cuda, and the moving :base and :cuda;
# - by hand (Actions › images › Run workflow): :edge-base and :edge-cuda only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "list=$IMAGE:${GITHUB_REF#refs/tags/v}-base,$IMAGE:base" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:${GITHUB_REF#refs/tags/v}-base" >> "$GITHUB_OUTPUT"
          else
            echo "list=$IMAGE:edge-base" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:edge-base" >> "$GITHUB_OUTPUT"
          fi
      # Text through Ollama and the silent stub run on any machine: amd64 and arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=herde: a worker that does AI work for projects that host its protocol (text through Ollama, no speech model)
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
      - name: it starts
        run: docker run --rm "${{ steps.tags.outputs.first }}" --help

  cuda:
    runs-on: ubuntu-latest
    steps:
      # PyTorch with CUDA is several GB: the runner's preinstalled tools have to make room.
      - name: room for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "list=$IMAGE:${GITHUB_REF#refs/tags/v}-cuda,$IMAGE:cuda" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:${GITHUB_REF#refs/tags/v}-cuda" >> "$GITHUB_OUTPUT"
          else
            echo "list=$IMAGE:edge-cuda" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:edge-cuda" >> "$GITHUB_OUTPUT"
          fi
      # Qwen3-TTS on an NVIDIA GPU: amd64 (Linux, and Windows through Docker Desktop and WSL2).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: cuda
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=herde: a worker that does AI work for projects that host its protocol (Qwen3-TTS on an NVIDIA GPU, text through Ollama)
      # No GPU here: this proves the packages are there and import, not that they speak.
      - name: the speech packages import
        run: |
          docker run --rm --entrypoint python "${{ steps.tags.outputs.first }}" -c \
            "import torch, qwen_tts; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
          docker run --rm "${{ steps.tags.outputs.first }}" --help
